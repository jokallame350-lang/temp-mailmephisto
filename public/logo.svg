    <path d="M120 180L240 280C248.889 287.407 263.111 287.407 272 280L392 180V160H120V180Z" fill="#0A0A0C" fill-opacity="0.4"/>
    
    <!-- Horn Details -->
    <path d="M220 130C210 110 180 100 160 110C170 130 190 150 210 160" stroke="url(#paint0_linear)" stroke-width="12" stroke-linecap="round"/>
    <path d="M292 130C302 110 332 100 352 110C342 130 322 150 302 160" stroke="url(#paint0_linear)" stroke-width="12" stroke-linecap="round"/>
  </g>
  
