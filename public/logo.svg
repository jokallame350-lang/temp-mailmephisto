    <path d="M120 180C120 168.954 128.954 160 140 160H372C383.046 160 392 168.954 392 180V332C392 343.046 383.046 352 372 352H140C128.954 352 120 343.046 120 332V180Z" fill="url(#paint0_linear)"/>
    
